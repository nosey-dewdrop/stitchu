# pages.yml — publishes web/ to GitHub Pages, BEHIND A REAL GATE.
#
# Until 2026-08-17 this workflow ran ZERO checks: every push touching web/**
# shipped straight to the public site. scripts/deploy.sh carries a five-step
# proof chain, but nothing forced anyone through it, and proof #2 (header-diff)
# had been crashing since af49514 deleted web/patterns/ — so the honest path was
# dead while the blind path was live. That is the T7/T17 class: a green badge
# holding nothing.
#
# The `verify` job below is the subset of scripts/deploy.sh that is TRUE in a
# fresh clone with node alone. `deploy` cannot run unless it passes.
#
# WHAT IS DELIBERATELY NOT HERE: the C++ ctest suite. Reason, declared rather
# than hidden — the suite needs a full cmake build and today carries FIVE
# declared reds (h10_gate_check, style_check, figure_check, preview_truth_check,
# contract_check). Wiring it with an -E exclusion list would put a maintained
# lie in CI: the list would rot into a mute button. ctest stays where it is
# measured honestly and in full, on both numbers: the local rabadon pushGate.
# See HEDEF.md § SAYAÇ.
name: pages (gated deploy)
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # deploy.sh step 1 tail: web/ must carry exactly ONE ?v cache-bust version.
      # More than one means a half-applied bump ships stale assets to a live page.
      - name: single ?v version across web/
        run: |
          set -euo pipefail
          VCOUNT=$(grep -rho '?v=[0-9]*' web --include='*.html' --include='*.js' --include='*.css' \
            | sort -u | wc -l | tr -d ' ')
          echo "distinct ?v versions in web/: $VCOUNT"
          [ "$VCOUNT" = "1" ] || { echo "FAIL: web/ carries $VCOUNT distinct ?v versions (must be exactly 1)"; exit 1; }

      # deploy.sh step 2: every hardcoded workers.dev URL must equal config.js
      # (K0 5.5 divergence class — a stale inline copy points the live site at a
      # dead backend).
      - name: worker URL single source
        run: |
          set -euo pipefail
          CANON=$(grep -o "https://[a-z0-9.-]*workers\.dev" web/js/config.js | head -1)
          [ -n "$CANON" ] || { echo "FAIL: no canonical worker URL in web/js/config.js"; exit 1; }
          echo "canonical: $CANON"
          BAD=$(grep -rho "https://[a-z0-9.-]*\.workers\.dev" web --include='*.html' --include='*.js' \
            | grep -v '<account>' | grep -vF "$CANON" | sort -u || true)
          [ -z "$BAD" ] || { echo "FAIL: worker URL drift vs config.js:"; echo "$BAD"; exit 1; }

      # deploy.sh proof 2: one canonical header, byte-identical on every page.
      - name: header-diff
        run: node engine/tools/header-diff.mjs

      # TUR 13: site health — dead internal links, sitemap vs reality, and any
      # generator that would rewind the site's ?v. Until this step existed
      # NOTHING measured the live site, and three defects reached Damla's public
      # face while every tool involved exited 0:
      #   228 dead internal references, web/index.html among them (187 dead
      #       hrefs and 41 broken <img> — holes in the page, not just links);
      #    22 sitemap URLs returning 404 to Google, while 24 live pages were
      #       absent from the sitemap entirely;
      #     5 generators pinned at ?v=80/84/85/90 against a site at 136.
      #
      # GREEN SINCE TUR 18 (18C). The one remaining dead reference was
      # web/blog/index.html -> ../patterns/: a noindex redirect stub whose
      # target af49514 deleted, so it sent every old inbound /blog/ link into a
      # 404 — the one job it existed for, failed. It stayed red for two turns
      # because guard.json's generated-web-html rule covers web/blog/**
      # ("change the generator, not the HTML") and NO generator produced the
      # file, so every honest exit was blocked. 18C resolved it the only way
      # the rule sanctions: the path was given its producer (step below), which
      # declares the stub's target as permanently gone and therefore REMOVES it
      # rather than pointing old links into a 404. Neither guard pattern was
      # loosened — the match is byte-identical and web/blog/ stays sealed.
      # Measured: 1 FAIL -> 0 FAIL, 128 -> 127 pages, 2598 -> 2597 refs,
      # sitemap 124 and indexable 124 both unchanged.
      #
      # This step runs FIRST so a fabricated redirect target can never reach
      # site-health: a declared target that is not on disk is fatal here.
      - name: legacy-redirects
        run: node engine/tools/gen-legacy-redirects.mjs --check

      - name: site-health
        run: node engine/tools/site-health.mjs

      # TUR 18 (18C): the atelier's size dial ships EIGHT sizes (EU34..EU48) but
      # contract/tables.json flat.size stops at EU42 — five rows. Both consumers
      # index that table directly (web/atolye.html:421 and the read-only pen
      # engine/flat-engine/_engine-full.mjs:37, `SIZE[p.size]` -> `sz.shp`).
      #
      # RED TODAY, declared rather than hidden: 12 of 32. Measured end to end by
      # running the SHIPPED page's own draw() over 4 topology branches x 8 dial
      # positions — EU34..EU42 draw and are byte-deterministic in all four
      # branches; EU44/EU46/EU48 THROW in all four. The engine is honest; the UI
      # is not: paint() catches the throw and `return`s ABOVE the lines that
      # update the drawing, the size label and every dial readout, so a visitor
      # who drags to EU48 keeps looking at the EU42 drawing, still labelled
      # EU42. A silent skip, which this shift has ruled worse than a crash ten
      # times over, so it now has a gate.
      #
      # The three missing rows belong to contract/tables.json and are NOT
      # invented here (DAMLA-KUYRUK K22). This gate only refuses to stay silent
      # — the same posture as validate-contract below. It also exits 2, never 0,
      # when it cannot measure.
      - name: size-coverage
        run: node engine/tools/size-coverage-check.mjs

      # deploy.sh proof 3: contract/vocab/gen drift AND the copyright boundary
      # (check 5b). This one is RED today and it is red for a real reason:
      # patterns_real/ has 49 tracked files, 8 of them purchased BugraPatterns
      # PDFs, in a PUBLIC repo. A pipeline must not be able to publish a public
      # site while that is live. Clearing it is Damla's call (DAMLA-KUYRUK K1);
      # this gate only refuses to stay silent about it.
      - name: validate-contract
        run: node engine/tools/validate-contract.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
