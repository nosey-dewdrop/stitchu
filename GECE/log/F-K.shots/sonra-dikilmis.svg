<text x="24" y="22" font-family="Helvetica,Arial" font-size="14" fill="#111">F-K sonra — yaka GIYSIYE dikilmis (yaka cizgisi ustunde)</text>
<text x="24" y="40" font-family="Helvetica,Arial" font-size="9" fill="#666">yesil = giysinin kendi yaka cizgisi (arka CB->omuz + on omuz->CF, omuzda 2 cm bindirilmis) · kirmizi kesikli = yakanin boyun kenari</text>
